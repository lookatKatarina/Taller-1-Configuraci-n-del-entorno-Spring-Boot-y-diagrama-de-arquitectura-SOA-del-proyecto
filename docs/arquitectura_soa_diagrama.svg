<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 550" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, sans-serif; font-weight: bold; font-size: 18px; fill: #1e293b; }
      .subtitle { font-family: system-ui, sans-serif; font-size: 13px; fill: #64748b; }
      .box-title { font-family: system-ui, sans-serif; font-weight: bold; font-size: 14px; fill: #0f172a; }
      .box-desc { font-family: system-ui, sans-serif; font-size: 12px; fill: #334155; }
      .flow-label-200 { font-family: system-ui, sans-serif; font-weight: 600; font-size: 11px; fill: #166534; }
      .flow-label-404 { font-family: system-ui, sans-serif; font-weight: 600; font-size: 11px; fill: #991b1b; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc"/>

  <!-- Header -->
  <text x="30" y="40" class="title">Diagrama de Arquitectura SOA — API REST Café Soluble S.A.</text>
  <text x="30" y="60" class="subtitle">Representación técnica de los flujos de petición exitosa (200 OK) y recurso inexistente (404 NOT FOUND)</text>

  <!-- Cliente Postman -->
  <rect x="40" y="100" width="180" height="380" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="130" text-anchor="middle" class="box-title">Cliente / Postman</text>
  <text x="130" y="150" text-anchor="middle" class="box-desc">(Consumidor HTTP/REST)</text>
  <rect x="55" y="180" width="150" height="70" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="130" y="205" text-anchor="middle" class="box-desc" font-weight="bold">Petición 200 OK</text>
  <text x="130" y="225" text-anchor="middle" class="flow-label-200">GET /api/productos/3</text>
  <rect x="55" y="370" width="150" height="70" rx="6" fill="#ffffff" stroke="#fca5a5"/>
  <text x="130" y="395" text-anchor="middle" class="box-desc" font-weight="bold">Petición 404 Error</text>
  <text x="130" y="415" text-anchor="middle" class="flow-label-404">GET /api/productos/999</text>

  <!-- Aplicación Spring Boot Container -->
  <rect x="270" y="100" width="510" height="380" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <rect x="270" y="100" width="510" height="36" rx="12" fill="#f1f5f9"/>
  <text x="525" y="123" text-anchor="middle" class="box-title">Aplicación Spring Boot (Puerto 8080 - Embedded Tomcat)</text>

  <!-- Spring Component 1: DispatcherServlet -->
  <rect x="300" y="160" width="180" height="80" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="390" y="195" text-anchor="middle" class="box-title">DispatcherServlet</text>
  <text x="390" y="215" text-anchor="middle" class="box-desc">(Front Controller)</text>

  <!-- Spring Component 2: ProductoController -->
  <rect x="560" y="160" width="190" height="80" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="655" y="190" text-anchor="middle" class="box-title">ProductoController</text>
  <text x="655" y="210" text-anchor="middle" class="box-desc">@RestController</text>
  <text x="655" y="225" text-anchor="middle" class="box-desc">/api/productos</text>

  <!-- Spring Component 3: Jackson Mapper -->
  <rect x="300" y="360" width="180" height="80" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="390" y="395" text-anchor="middle" class="box-title">Jackson Mapper</text>
  <text x="390" y="415" text-anchor="middle" class="box-desc">Java Object &lt;--&gt; JSON</text>

  <!-- Spring Component 4: GlobalExceptionHandler -->
  <rect x="560" y="360" width="190" height="80" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="655" y="390" text-anchor="middle" class="box-title">GlobalExceptionHandler</text>
  <text x="655" y="410" text-anchor="middle" class="box-desc">@RestControllerAdvice</text>
  <text x="655" y="425" text-anchor="middle" class="box-desc">Captura 404 NOT FOUND</text>

  <!-- Memoria Repository -->
  <rect x="830" y="100" width="180" height="380" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2" filter="url(#shadow)"/>
  <text x="920" y="135" text-anchor="middle" class="box-title">ProductoRepository</text>
  <text x="920" y="155" text-anchor="middle" class="box-desc">(Productos en Memoria)</text>
  <rect x="845" y="180" width="150" height="270" rx="8" fill="#ffffff" stroke="#fed7aa"/>
  <text x="920" y="210" text-anchor="middle" class="box-desc" font-weight="bold">CopyOnWriteArrayList</text>
  <text x="920" y="235" text-anchor="middle" class="box-desc">• Producto #1 (50g)</text>
  <text x="920" y="255" text-anchor="middle" class="box-desc">• Producto #2 (100g)</text>
  <text x="920" y="275" text-anchor="middle" class="box-desc" font-weight="bold" fill="#15803d">• Producto #3 (250g)</text>
  <text x="920" y="295" text-anchor="middle" class="box-desc">• Producto #4 (500g)...</text>
  <text x="920" y="330" text-anchor="middle" class="box-desc" font-style="italic">(8 productos base)</text>

  <!-- ARROWS - FLOW 1 (GREEN 200 OK) -->
  <path d="M 220 200 L 292 200" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M 480 200 L 552 200" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M 750 200 L 838 200" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M 838 275 L 755 275 L 755 380 L 660 380 L 488 380" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M 300 400 L 228 400" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)"/>

  <!-- ARROWS - FLOW 2 (RED 404 NOT FOUND) -->
  <path d="M 205 435 L 250 435 L 250 220 L 292 220" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow-red)"/>
  <path d="M 655 240 L 655 352" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow-red)"/>
  <path d="M 560 400 L 488 400" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow-red)"/>
  <path d="M 300 420 L 228 420" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow-red)"/>

</svg>
